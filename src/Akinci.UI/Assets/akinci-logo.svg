<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" width="100%" height="100%">
  <defs>
    <!-- Zemin Arka Planı (Önizleme ve Kontrast İçin) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#242734" />
      <stop offset="100%" stop-color="#18181B" />
    </radialGradient>

    <!-- İndirme Akışı Neon Gradyanı -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Koyu Zeminde Parlama (Glow) Filtresi -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Koyu Zemin Katmanı -->
  <rect width="600" height="620" rx="32" fill="url(#bgGlow)" />

  <g id="Akinci-Dark-Logo">
    <!-- ==================== SOL: KARTAL BAŞI & SAVAŞÇI GÖĞÜS ==================== -->
    <!-- Kartal Gagası (Canlı Altın Vurgu) -->
    <polygon points="50,305 75,275 95,290 85,325 58,340" fill="#FACC15" />
    <polygon points="58,340 85,325 90,345 65,348" fill="#CA8A04" />
    
    <!-- Kartal Kafası (Koyu Fasetler Üzerinde Aydınlatılmış Gri/Gümüş) -->
    <polygon points="75,275 130,245 155,275 95,290" fill="#E2E8F0" />
    <polygon points="95,290 155,275 160,310 135,325 85,325" fill="#94A3B8" />
    <polygon points="130,245 175,240 185,270 155,275" fill="#F8FAFC" />
    
    <!-- Kartal Göz Yuvası -->
    <polygon points="110,278 125,275 128,283 115,285" fill="#0F172A" />
    <circle cx="118" cy="279" r="1.5" fill="#FACC15" />

    <!-- Kartal Yele ve Göğüs Çokgenleri (Kontrastı Artırılmış Koyu Zırh Tonları) -->
    <polygon points="135,325 160,310 190,345 155,370" fill="#475569" />
    <polygon points="160,310 185,270 215,315 190,345" fill="#334155" />
    <polygon points="175,240 210,210 230,265 185,270" fill="#1E293B" />
    <polygon points="210,210 240,165 255,230 230,265" fill="#334155" />
    <polygon points="155,370 190,345 220,395 185,420" fill="#1E293B" />

    <!-- Kartal Yükselen Hücum Kanatları -->
    <polygon points="160,185 195,230 175,240" fill="#475569" />
    <polygon points="175,130 215,200 200,215" fill="#334155" />
    <polygon points="215,100 245,185 230,195" fill="#1E293B" />

    <!-- ==================== ORTA: SİBER İNDİRME OKU (DOWNLOAD ENGINE) ==================== -->
    <g filter="url(#cyanGlow)">
      <!-- Ok Sol Kanadı / Gövdesi -->
      <polygon points="255,230 290,265 270,395 245,360" fill="url(#neonGlowGrad)" />
      <!-- Ok Ana Gövde İnişi -->
      <polygon points="290,265 330,265 315,395 270,395" fill="url(#neonCyan)" />
      <!-- Ok Sivri Ucu (Merkezi Hücum Noktası) -->
      <polygon points="245,390 315,390 280,455" fill="#00E5FF" />
      <polygon points="315,390 345,390 280,455" fill="#0284C7" />
    </g>

    <!-- Parçalı Akış Parçacıkları (Floating Chunks) -->
    <polygon points="228,295 244,285 239,320 223,325" fill="#38BDF8" filter="url(#softGlow)" />
    <polygon points="342,335 358,325 353,365 337,370" fill="#00E5FF" filter="url(#softGlow)" />
    <polygon points="295,210 305,200 302,225 292,230" fill="#38BDF8" opacity="0.9" />

    <!-- ==================== SAĞ: GÜVERCİN (PARLAK KRİSTAL FORM) ==================== -->
    <!-- Gövde ve Kanat Bağlantısı -->
    <polygon points="330,265 385,230 405,310 315,395" fill="#CBD5E1" />
    <polygon points="385,230 435,285 405,310" fill="#94A3B8" />
    <polygon points="315,395 405,310 430,375 350,420" fill="#64748B" />

    <!-- Güvercin Yükselen Kanatları (Buz Mavisi & Beyaz Kristal) -->
    <polygon points="385,230 430,140 455,225" fill="#F8FAFC" />
    <polygon points="430,140 480,210 455,225" fill="#E0F2FE" />
    <polygon points="455,225 480,210 515,260 470,270" fill="#BAE6FD" />

    <!-- Güvercin Baş & Gaga -->
    <polygon points="470,270 515,260 525,235 490,230" fill="#F8FAFC" />
    <polygon points="490,230 525,235 520,215 480,210" fill="#FFFFFF" />
    <polygon points="525,235 545,240 520,248" fill="#FDA4AF" />
    <circle cx="505" cy="232" r="3" fill="#0F172A" />

    <!-- Kuyruk Fasetleri -->
    <polygon points="405,310 475,320 440,380 430,375" fill="#E2E8F0" />
    <polygon points="440,380 475,320 510,345 465,405" fill="#94A3B8" />
    <polygon points="430,375 465,405 445,445 410,410" fill="#64748B" />

    <!-- ==================== TİPOGRAFİ: AKINCI ==================== -->
    <g filter="url(#softGlow)">
      <text x="300" y="550" text-anchor="middle" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="14" fill="#F8FAFC">AKINCI</text>
    </g>
    <text x="300" y="580" text-anchor="middle" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="500" font-size="13" letter-spacing="5" fill="#38BDF8">HIGH-PERFORMANCE DOWNLOAD MANAGER</text>
  </g>
</svg>